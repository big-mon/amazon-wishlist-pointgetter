name: Deploy to Chrome Web Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - name: Check if version changed
        id: version-check
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch, proceeding with deployment"
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "Push event has no usable before SHA, skipping deployment safely"
            exit 0
          fi

          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null || \
             ! git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "Before commit or its package.json is unavailable, skipping deployment safely"
            exit 0
          fi

          previous_version="$(git show "${BEFORE_SHA}:package.json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          current_version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"])')"

          echo "Previous package.json version: ${previous_version}"
          echo "Current package.json version: ${current_version}"

          if [ "$previous_version" != "$current_version" ]; then
            echo "version-changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed, proceeding with deployment"
          else
            echo "version-changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged, skipping deployment"
          fi
        
      - name: Setup Node.js
        if: steps.version-check.outputs.version-changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup pnpm
        if: steps.version-check.outputs.version-changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          
      - name: Install dependencies
        if: steps.version-check.outputs.version-changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.version-check.outputs.version-changed == 'true'
        run: pnpm test

      - name: Type-check
        if: steps.version-check.outputs.version-changed == 'true'
        run: pnpm type-check
        
      - name: Clean build and create zip file
        if: steps.version-check.outputs.version-changed == 'true'
        run: pnpm zip
          
      - name: Upload to Chrome Web Store
        if: steps.version-check.outputs.version-changed == 'true'
        env:
          CHROME_EXTENSION_ZIP_PATH: extension.zip
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH: "true"
        run: node scripts/upload-chrome-web-store.js
